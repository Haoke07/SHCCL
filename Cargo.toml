[workspace]
members = [
    "crates/shccl-core",
    "crates/shccl-cli",
    "crates/shccl-tui",
    "crates/shccl-gui",
]
default-members = ["crates/shccl-cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["SHCCL Contributors"]
description = "Smart Home Control Craft Launcher"

[workspace.dependencies]
shccl-core = { path = "crates/shccl-core" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
futures-util = "0.3"
md-5 = "0.10"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sdl3 = { version = "0.20", features = ["main"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
